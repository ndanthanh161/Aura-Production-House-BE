version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: aura_postgres_vector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    container_name: aura_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_api
    ports:
      - "7283:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_URL}
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=${JWT_SECRET}
      - GoogleAuth__ClientId=${GOOGLE_CLIENT_ID}
      - MailSettings__Mail=${MAIL_USER}
      - MailSettings__Password=${MAIL_PASSWORD}
      - MailSettings__Host=${MAIL_HOST}
      - MailSettings__Port=${MAIL_PORT}
      - MailSettings__DisplayName=${MAIL_DISPLAY_NAME}
      - AiSettings__ApiKey=${OPENAI_API_KEY}
      - SePay__ApiKey=${SEPAY_API_KEY}
      - SePay__BankId=${SEPAY_BANK_ID}
      - SePay__AccountNumber=${SEPAY_ACCOUNT_NUMBER}
      - SePay__AccountName=${SEPAY_ACCOUNT_NAME}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ../Exe
      dockerfile: Dockerfile
    container_name: aura_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
