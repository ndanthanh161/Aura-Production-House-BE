version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: aura_postgres_vector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: AuraProductionDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
